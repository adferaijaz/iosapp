<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            overflow-x: hidden;
        }
        .glass {
            background: rgba(28, 28, 30, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        /* Extra deep Apple-like blur for the lock screen overlay */
        .apple-blur {
            background: rgba(15, 15, 17, 0.7);
            backdrop-filter: blur(35px) saturate(160%);
            -webkit-backdrop-filter: blur(35px) saturate(160%);
        }
        .ios-transition {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scroll-bar-width: none; }

        /* Keyframe Engines for Face ID Logic Graphics */
        @keyframes dynamic-scan {
            0% { transform: rotate(0deg); border-color: rgba(59, 130, 246, 0.4); }
            50% { border-color: rgba(59, 130, 246, 1); }
            100% { transform: rotate(360deg); border-color: rgba(59, 130, 246, 0.4); }
        }
        .scanning-ring {
            animation: dynamic-scan 2s linear infinite;
        }
        @keyframes ios-shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .shake-error {
            animation: ios-shake 0.35s ease-in-out;
        }
    </style>
</head>
<body class="pb-28 min-h-screen select-none overflow-hidden" id="app-body">

    <div id="lock-screen" class="fixed inset-0 z-50 apple-blur flex flex-col items-center justify-center p-4 transition-all duration-700 opacity-100">
        <div id="pin-container" class="w-full max-w-sm flex flex-col items-center space-y-8 transform transition-all duration-500 scale-100">
            
            <div class="relative w-24 h-24 flex items-center justify-center">
                <div id="faceid-ring" class="absolute inset-0 rounded-[28px] border-2 border-zinc-700 transition-all duration-500"></div>
                <div id="faceid-glyph" class="text-zinc-300 transition-all duration-500 transform scale-100">
                    <i data-lucide="scan-face" class="w-12 h-12 stroke-[1.5]"></i>
                </div>
            </div>

            <div class="text-center space-y-1.5">
                <h2 id="lock-title" class="text-xl font-semibold tracking-tight text-white">Enter Passcode</h2>
                <p id="lock-subtitle" class="text-xs text-zinc-400 font-medium">This library is encrypted and private</p>
            </div>

            <div class="flex justify-center items-center gap-3 py-2">
                <div class="pin-dot w-3 h-3 rounded-full border border-zinc-500 transition-all duration-200"></div>
                <div class="pin-dot w-3 h-3 rounded-full border border-zinc-500 transition-all duration-200"></div>
                <div class="pin-dot w-3 h-3 rounded-full border border-zinc-500 transition-all duration-200"></div>
                <div class="pin-dot w-3 h-3 rounded-full border border-zinc-500 transition-all duration-200"></div>
                <div class="pin-dot w-3 h-3 rounded-full border border-zinc-500 transition-all duration-200"></div>
                <div class="pin-dot w-3 h-3 rounded-full border border-zinc-500 transition-all duration-200"></div>
                <div class="pin-dot w-3 h-3 rounded-full border border-zinc-500 transition-all duration-200"></div>
                <div class="pin-dot w-3 h-3 rounded-full border border-zinc-500 transition-all duration-200"></div>
                <div class="pin-dot w-3 h-3 rounded-full border border-zinc-500 transition-all duration-200"></div>
                <div class="pin-dot w-3 h-3 rounded-full border border-zinc-500 transition-all duration-200"></div>
                <div class="pin-dot w-3 h-3 rounded-full border border-zinc-500 transition-all duration-200"></div>
            </div>

            <input type="tel" id="hidden-pin-input" maxlength="11" class="absolute opacity-0 pointer-events-none touch-none" autocomplete="off" autofocus>

            <p class="text-xs text-zinc-500 font-medium pt-4 pointer-events-none">Type using your keyboard keypad map</p>
        </div>
    </div>


    <header class="sticky top-0 z-40 glass border-b border-zinc-800 px-4 py-3 flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-bold tracking-tight">Library</h1>
            <p id="photo-count" class="text-xs text-zinc-400 mt-0.5">Loading library...</p>
        </div>
        <div class="flex items-center gap-2">
            <button id="select-mode-btn" onclick="toggleSelectMode()" class="text-sm font-medium text-blue-500 hover:text-blue-400 px-3 py-2 rounded-lg ios-transition">
                Select
            </button>
            <button onclick="handleUploadButtonClick()" class="flex items-center gap-1 bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-full text-sm font-medium ios-transition shadow-lg">
                <i data-lucide="plus" class="w-4 h-4"></i> Add
            </button>
        </div>
    </header>

    <main id="gallery" class="p-4 max-w-7xl mx-auto space-y-8">
        <div class="flex flex-col items-center justify-center py-20 text-zinc-500">
            <div class="animate-spin rounded-full h-8 w-8 border-t-2 border-blue-500 mb-4"></div>
            <p>Reading repository data...</p>
        </div>
    </main>

    <div id="delete-toolbar" class="fixed bottom-20 left-1/2 -translate-x-1/2 z-40 glass border border-zinc-800 px-4 py-2.5 rounded-full hidden items-center gap-4 shadow-2xl animate-fade-in whitespace-nowrap">
        <span id="selected-count" class="text-xs font-semibold text-zinc-400 px-1">0 Selected</span>
        <button onclick="downloadSelectedMedia()" class="flex items-center gap-1.5 bg-zinc-800 hover:bg-zinc-700 active:scale-95 text-white px-3 py-1.5 rounded-full text-xs font-semibold ios-transition">
            <i data-lucide="download" class="w-3.5 h-3.5 text-blue-400"></i> Save to Device
        </button>
        <button onclick="deleteSelectedMedia()" class="flex items-center gap-1.5 bg-red-950/40 hover:bg-red-600 border border-red-900/60 hover:border-transparent text-red-400 hover:text-white px-3 py-1.5 rounded-full text-xs font-semibold ios-transition">
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Delete
        </button>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 z-40 glass border-t border-zinc-800 py-2 flex justify-around items-center">
        <button class="flex flex-col items-center gap-1 text-blue-500">
            <i data-lucide="image" class="w-6 h-6"></i>
            <span class="text-[10px] font-medium">Library</span>
        </button>
        <button onclick="alert('For You features coming soon!')" class="flex flex-col items-center gap-1 text-zinc-400 hover:text-zinc-200">
            <i data-lucide="heart" class="w-6 h-6"></i>
            <span class="text-[10px] font-medium">For You</span>
        </button>
        <button onclick="openSettingsModal()" class="flex flex-col items-center gap-1 text-zinc-400 hover:text-zinc-200">
            <i data-lucide="settings" class="w-6 h-6"></i>
            <span class="text-[10px] font-medium">Setup Auth</span>
        </button>
    </nav>

    <div id="lightbox" class="fixed inset-0 bg-black z-50 hidden flex-col justify-between opacity-0 ios-transition">
        <div class="p-4 flex justify-between items-center z-50 bg-gradient-to-b from-black/80 to-transparent">
            <span id="lightbox-date" class="text-sm font-semibold text-zinc-300"></span>
            <div class="flex items-center gap-3">
                <button id="lightbox-dl-btn" class="p-2 bg-zinc-900/80 hover:bg-zinc-800 text-zinc-300 rounded-full active:scale-90 ios-transition">
                    <i data-lucide="download" class="w-4 h-4"></i>
                </button>
                <button onclick="closeLightbox()" class="p-2 bg-zinc-900/80 hover:bg-zinc-800 text-white rounded-full active:scale-90 ios-transition">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
        <div id="lightbox-main-view" class="relative w-full flex-1 flex items-center justify-center overflow-hidden touch-pan-y">
            <button onclick="navigateCarousel(-1)" class="absolute left-4 z-50 p-3 bg-zinc-900/40 rounded-full hover:bg-zinc-800/80 invisible md:visible"><i data-lucide="chevron-left" class="w-6 h-6"></i></button>
            <button onclick="navigateCarousel(1)" class="absolute right-4 z-50 p-3 bg-zinc-900/40 rounded-full hover:bg-zinc-800/80 invisible md:visible"><i data-lucide="chevron-right" class="w-6 h-6"></i></button>
            <div id="lightbox-content" class="w-full h-full flex items-center justify-center p-4 transform scale-95 opacity-0 ios-transition"></div>
        </div>
        <div class="w-full bg-gradient-to-t from-black/90 via-black/70 to-transparent pt-4 pb-6 px-2 z-50">
            <div id="filmstrip" class="max-w-xl mx-auto flex gap-1.5 overflow-x-auto py-1 no-scrollbar scroll-smooth snap-x"></div>
        </div>
    </div>

    <div id="upload-modal" class="fixed inset-0 bg-black/80 z-50 hidden items-center justify-center p-4 backdrop-blur-sm">
        <div class="glass border border-zinc-800 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl scale-95 opacity-0 ios-transition" id="upload-box">
            <div class="flex justify-between items-center">
                <h3 class="text-xl font-bold">Upload to GitHub</h3>
                <button onclick="closeUploadModal()" class="text-zinc-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <input type="file" id="file-input" accept="image/*,video/*" class="hidden" multiple onchange="handleFileQueueSelection(event)">
            <label id="drop-zone" for="file-input" class="border-2 border-dashed border-zinc-700 hover:border-blue-500 rounded-xl p-6 flex flex-col items-center justify-center gap-2 cursor-pointer ios-transition">
                <i data-lucide="upload-cloud" class="w-8 h-8 text-zinc-500"></i>
                <span class="text-sm font-medium text-zinc-300">Select Multiple Photos / Videos</span>
            </label>
            <div id="queue-container" class="max-h-48 overflow-y-auto space-y-2 no-scrollbar hidden">
                <p class="text-xs font-semibold uppercase text-zinc-400 tracking-wider">Upload Queue</p>
                <div id="upload-queue-list" class="space-y-1.5"></div>
            </div>
            <button onclick="processUploadQueue()" id="upload-btn" class="w-full bg-blue-600 disabled:bg-zinc-700 disabled:text-zinc-500 text-white font-medium py-3 rounded-xl ios-transition shadow-lg" disabled>
                Push Items to GitHub
            </button>
        </div>
    </div>

    <div id="settings-modal" class="fixed inset-0 bg-black/80 z-50 hidden items-center justify-center p-4 backdrop-blur-sm">
        <div class="glass border border-zinc-800 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
            <h3 class="text-xl font-bold">GitHub Authentication</h3>
            <p class="text-xs text-zinc-400">Credentials are required to write/delete files.</p>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold uppercase text-zinc-400 mb-1">GitHub Username</label>
                    <input type="text" id="cfg-user" placeholder="e.g., john-doe" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-zinc-400 mb-1">Repository Name</label>
                    <input type="text" id="cfg-repo" placeholder="e.g., my-photos" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-zinc-400 mb-1">Personal Access Token (PAT)</label>
                    <input type="password" id="cfg-token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500">
                </div>
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="closeSettingsModal()" class="flex-1 bg-zinc-800 hover:bg-zinc-700 text-white py-2 rounded-xl text-sm font-medium ios-transition">Cancel</button>
                <button onclick="saveSettings()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-2 rounded-xl text-sm font-medium ios-transition">Save & Continue</button>
            </div>
        </div>
    </div>

    <script>
        const TARGET_PIN = "20175288023";
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        const autoUsername = window.location.hostname.split('.')[0];
        const autoRepo = pathSegments[0] || '';

        let CONFIG = {
            username: localStorage.getItem('gh_user') || autoUsername,
            repo: localStorage.getItem('gh_repo') || autoRepo,
            token: localStorage.getItem('gh_token') || '',
            folder: 'media'
        };

        let globalMediaRegistry = []; 
        let currentCarouselIndex = -1;
        let uploadFileQueue = []; 
        let isSelectMode = false;
        let selectedItems = []; 
        let touchStartX = 0; let touchEndX = 0;

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            fetchGalleryData();
            setupGestureListeners();
            setupLockScreenSecurityEngine();
        });

        /* --- AUTH CORE MECHANICS ENGINE: FACE ID IMPLEMENTATION --- */
        function setupLockScreenSecurityEngine() {
            const hiddenInput = document.getElementById('hidden-pin-input');
            const container = document.getElementById('pin-container');
            const dots = document.querySelectorAll('.pin-dot');

            // Force interaction capture straight onto hidden field
            document.getElementById('lock-screen').addEventListener('click', () => hiddenInput.focus());
            hiddenInput.focus();

            hiddenInput.addEventListener('input', (e) => {
                let currentVal = e.target.value.replace(/\D/g, '');
                e.target.value = currentVal; // Strip letters cleanly
                
                // Track indicators updates 
                dots.forEach((dot, idx) => {
                    if (idx < currentVal.length) {
                        dot.classList.remove('border-zinc-500');
                        dot.classList.add('bg-white', 'border-white', 'scale-110');
                    } else {
                        dot.classList.remove('bg-white', 'border-white', 'scale-110');
                        dot.classList.add('border-zinc-500');
                    }
                });

                // Trigger verify upon hitting full target bounds
                if (currentVal.length === 11) {
                    if (currentVal === TARGET_PIN) {
                        triggerAppleFaceIDSuccessAnimation();
                    } else {
                        // Error handling sequence branch
                        container.classList.add('shake-error');
                        dots.forEach(dot => { dot.classList.replace('bg-white', 'bg-red-500'); dot.classList.replace('border-white', 'border-red-500'); });
                        
                        setTimeout(() => {
                            container.classList.remove('shake-error');
                            hiddenInput.value = '';
                            dots.forEach(dot => {
                                dot.className = "pin-dot w-3 h-3 rounded-full border border-zinc-500 transition-all duration-200";
                            });
                        }, 400);
                    }
                }
            });
        }

        function triggerAppleFaceIDSuccessAnimation() {
            const ring = document.getElementById('faceid-ring');
            const glyph = document.getElementById('faceid-glyph');
            const title = document.getElementById('lock-title');
            const subtitle = document.getElementById('lock-subtitle');
            const screen = document.getElementById('lock-screen');
            const body = document.getElementById('app-body');

            // Stage 1: Engage interactive round biometric scanner graphics 
            ring.classList.add('scanning-ring', 'border-blue-500');
            ring.style.borderRadius = "50%";
            title.innerText = "Verifying...";
            
            setTimeout(() => {
                // Stage 2: Resolve into Face ID check confirmation state
                ring.classList.remove('scanning-ring');
                ring.classList.replace('border-blue-500', 'border-green-500');
                ring.style.backgroundColor = "rgba(34, 197, 94, 0.1)";
                
                glyph.classList.add('scale-75');
                setTimeout(() => {
                    glyph.innerHTML = `<i data-lucide="check" class="w-12 h-12 text-green-400 stroke-[3.5]"></i>`;
                    lucide.createIcons();
                    glyph.classList.remove('scale-75');
                    glyph.classList.add('scale-110');
                    title.innerText = "Passcode Accepted";
                    subtitle.innerText = "Welcome back";
                }, 150);

                // Stage 3: Smooth overlay drop away layout slide framework exit 
                setTimeout(() => {
                    screen.classList.add('opacity-0', 'scale-105', 'pointer-events-none');
                    body.classList.remove('overflow-hidden'); // Unlock scrolling metrics
                    setTimeout(() => screen.remove(), 700);
                }, 1000);

            }, 1200);
        }

        function handleUploadButtonClick() {
            if (!CONFIG.token || !CONFIG.username || !CONFIG.repo) { openSettingsModal(); } else { openUploadModal(); }
        }

        function openSettingsModal() {
            document.getElementById('cfg-user').value = CONFIG.username;
            document.getElementById('cfg-repo').value = CONFIG.repo;
            document.getElementById('cfg-token').value = CONFIG.token;
            document.getElementById('settings-modal').classList.ireplace('hidden', 'flex');
        }

        function closeSettingsModal() { document.getElementById('settings-modal').classList.ireplace('flex', 'hidden'); }

        function saveSettings() {
            const user = document.getElementById('cfg-user').value.trim();
            const repo = document.getElementById('cfg-repo').value.trim();
            const token = document.getElementById('cfg-token').value.trim();
            if(!user || !repo || !token) return alert("All fields are required.");
            localStorage.setItem('gh_user', user); localStorage.setItem('gh_repo', repo); localStorage.setItem('gh_token', token);
            location.reload();
        }

        function toggleSelectMode() {
            isSelectMode = !isSelectMode;
            const btn = document.getElementById('select-mode-btn');
            const toolbar = document.getElementById('delete-toolbar');
            if (isSelectMode) { btn.innerText = "Cancel"; btn.classList.replace('text-blue-500', 'text-zinc-400'); } 
            else { btn.innerText = "Select"; btn.classList.replace('text-zinc-400', 'text-blue-500'); selectedItems = []; toolbar.classList.add('hidden'); }
            document.querySelectorAll('.media-card').forEach(card => {
                const badge = card.querySelector('.select-badge');
                card.classList.remove('scale-95', 'opacity-60', 'border-2', 'border-blue-500');
                if (isSelectMode) badge.classList.remove('hidden'); else badge.classList.add('hidden');
            });
        }

        function handleMediaClick(element, filename) {
            const matchedIndex = globalMediaRegistry.findIndex(m => m.name === filename);
            const item = globalMediaRegistry[matchedIndex];
            if (!isSelectMode) { openLightbox(matchedIndex); return; }

            const idx = selectedItems.findIndex(i => i.name === item.name);
            const badge = element.querySelector('.select-badge');
            if (idx > -1) {
                selectedItems.splice(idx, 1); element.classList.remove('scale-95', 'opacity-70', 'border-2', 'border-blue-500');
                badge.innerHTML = '<div class="w-5 h-5 rounded-full border-2 border-white/70 bg-black/20"></div>';
            } else {
                selectedItems.push(item); element.classList.add('scale-95', 'opacity-70', 'border-2', 'border-blue-500');
                badge.innerHTML = '<div class="w-5 h-5 bg-blue-500 rounded-full flex items-center justify-center text-white"><i data-lucide="check" class="w-3 h-3 stroke-[3]"></i></div>';
                lucide.createIcons();
            }
            const toolbar = document.getElementById('delete-toolbar');
            document.getElementById('selected-count').innerText = `${selectedItems.length} Selected`;
            if (selectedItems.length > 0) toolbar.classList.ireplace('hidden', 'flex'); else toolbar.classList.ireplace('flex', 'hidden');
        }

        async function forceDownloadAsset(url, filename) {
            try {
                const res = await fetch(url);
                const blob = await res.blob();
                const blobUrl = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = blobUrl; link.download = filename;
                document.body.appendChild(link); link.click();
                document.body.removeChild(link); URL.revokeObjectURL(blobUrl);
            } catch (e) { window.open(url, '_blank'); }
        }

        function downloadSelectedMedia() {
            if (selectedItems.length === 0) return;
            selectedItems.forEach(item => forceDownloadAsset(item.download_url, item.name));
            toggleSelectMode();
        }

        async function fetchGalleryData() {
            if(!CONFIG.username || !CONFIG.repo) {
                document.getElementById('gallery').innerHTML = '<div class="text-center py-20 text-zinc-500"><p class="text-sm">Please click "Setup Auth" below to link your repository.</p></div>';
                return;
            }
            const url = `https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${CONFIG.folder}`;
            try {
                const headers = CONFIG.token ? { 'Authorization': `token ${CONFIG.token}` } : {};
                const response = await fetch(url, { headers });
                if (!response.ok) throw new Error();
                const files = await response.json();
                
                const mediaExtensions = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'mp4', 'mov', 'webm'];
                let mediaFiles = files.filter(f => mediaExtensions.includes(f.name.split('.').pop().toLowerCase()));

                globalMediaRegistry = await Promise.all(mediaFiles.map(async (file) => {
                    let dateStr = new Date().toISOString().split('T')[0];
                    try {
                        const commitUrl = `https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/commits?path=${file.path}&per_page=1`;
                        const cRes = await fetch(commitUrl, { headers });
                        const commits = await cRes.json();
                        if(commits.length > 0) dateStr = commits[0].commit.committer.date.split('T')[0];
                    } catch(e) {}
                    return { name: file.name, download_url: file.download_url, sha: file.sha, date: dateStr, type: ['mp4', 'mov', 'webm'].includes(file.name.split('.').pop().toLowerCase()) ? 'video' : 'image' };
                }));

                globalMediaRegistry.sort((a, b) => b.date.localeCompare(a.date));
                renderGallery(globalMediaRegistry);
                buildFilmstripLayout();
            } catch (err) {
                document.getElementById('gallery').innerHTML = '<div class="text-center py-20 text-zinc-500"><p class="text-sm">No media files found in the "/media" directory yet.</p></div>';
            }
        }

        function renderGallery(items) {
            const gallery = document.getElementById('gallery'); gallery.innerHTML = '';
            document.getElementById('photo-count').innerText = `${items.length} items`;
            if(items.length === 0) return;
            const groups = {};
            items.forEach(item => { if(!groups[item.date]) groups[item.date] = []; groups[item.date].push(item); });

            for (const [date, mediaList] of Object.entries(groups)) {
                const formattedDate = new Date(date).toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' });
                const section = document.createElement('section'); section.className = "space-y-3";
                section.innerHTML = `
                    <div class="flex justify-between items-baseline sticky top-[60px] z-10 bg-black/80 backdrop-blur-md py-2"><h2 class="text-lg font-bold tracking-tight text-zinc-100">${formattedDate}</h2></div>
                    <div class="grid grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-1 md:gap-2">
                        ${mediaList.map(item => `
                            <div onclick="handleMediaClick(this, '${item.name}')" class="media-card aspect-square relative overflow-hidden bg-zinc-900 group cursor-pointer active:scale-95 duration-200 rounded-sm md:rounded-md">
                                <div class="select-badge absolute top-2 right-2 z-20 hidden"><div class="w-5 h-5 rounded-full border-2 border-white/70 bg-black/20"></div></div>
                                ${item.type === 'video' ? `<video src="${item.download_url}" class="w-full h-full object-cover pointer-events-none" muted playsinline></video><div class="absolute bottom-1.5 right-1.5 bg-black/50 backdrop-blur-sm p-0.5 rounded text-[10px] text-white flex items-center gap-0.5"><i data-lucide="video" class="w-3 h-3"></i></div>` 
                                : `<img src="${item.download_url}" loading="lazy" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">`}
                            </div>
                        `).join('')}
                    </div>`;
                gallery.appendChild(section);
            }
            lucide.createIcons();
        }

        function buildFilmstripLayout() {
            document.getElementById('filmstrip').innerHTML = globalMediaRegistry.map((item, idx) => `
                <div onclick="jumpToCarouselIndex(${idx})" id="strip-item-${idx}" class="w-10 h-14 md:w-12 md:h-16 flex-shrink-0 rounded-md overflow-hidden border border-transparent cursor-pointer snap-center ios-transition scale-90 opacity-60">
                    ${item.type === 'video' ? `<video src="${item.download_url}" class="w-full h-full object-cover pointer-events-none" muted></video>` : `<img src="${item.download_url}" class="w-full h-full object-cover pointer-events-none">`}
                </div>`).join('');
        }

        function openLightbox(index) {
            currentCarouselIndex = index;
            const box = document.getElementById('lightbox'); box.classList.ireplace('hidden', 'flex');
            setTimeout(() => { box.classList.remove('opacity-0'); renderActiveCarouselMedia(); }, 10);
        }

        function renderActiveCarouselMedia() {
            const item = globalMediaRegistry[currentCarouselIndex]; if (!item) return;
            const content = document.getElementById('lightbox-content');
            content.transform = "scale-95"; content.classList.add('opacity-0');

            setTimeout(() => {
                document.getElementById('lightbox-date').innerText = new Date(item.date).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
                content.innerHTML = item.type === 'video' ? `<video src="${item.download_url}" controls autoplay class="max-w-full max-h-[70vh] rounded-lg shadow-2xl object-contain"></video>` : `<img src="${item.download_url}" class="max-w-full max-h-[70vh] object-contain rounded-lg shadow-2xl" />`;
                document.getElementById('lightbox-dl-btn').onclick = () => forceDownloadAsset(item.download_url, item.name);
                content.transform = "scale-100"; content.classList.remove('opacity-0');
                updateFilmstripIndicators();
            }, 150);
        }

        function updateFilmstripIndicators() {
            globalMediaRegistry.forEach((_, idx) => {
                const thumb = document.getElementById(`strip-item-${idx}`); if (!thumb) return;
                if (idx === currentCarouselIndex) {
                    thumb.classList.remove('scale-90', 'opacity-60', 'border-transparent'); thumb.classList.add('scale-110', 'opacity-100', 'border-2', 'border-white', 'z-10');
                    thumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                } else {
                    thumb.classList.remove('scale-110', 'opacity-100', 'border-2', 'border-white', 'z-10'); thumb.classList.add('scale-90', 'opacity-60', 'border-transparent');
                }
            });
        }

        function navigateCarousel(direction) {
            let nextIdx = currentCarouselIndex + direction;
            if (nextIdx >= 0 && nextIdx < globalMediaRegistry.length) { currentCarouselIndex = nextIdx; renderActiveCarouselMedia(); }
        }

        function jumpToCarouselIndex(index) { if (index !== currentCarouselIndex) { currentCarouselIndex = index; renderActiveCarouselMedia(); } }
        
        function closeLightbox() {
            const box = document.getElementById('lightbox'); const content = document.getElementById('lightbox-content');
            box.classList.add('opacity-0');
            setTimeout(() => { box.classList.ireplace('flex', 'hidden'); content.innerHTML = ''; currentCarouselIndex = -1; }, 300);
        }

        function setupGestureListeners() {
            const viewZone = document.getElementById('lightbox-main-view');
            viewZone.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
            viewZone.addEventListener('touchend', e => { touchEndX = e.changedTouches[0].screenX; handleSwipeGesture(); }, { passive: true });
            window.addEventListener('keydown', e => {
                if (currentCarouselIndex === -1) return;
                if (e.key === 'ArrowRight') navigateCarousel(1); if (e.key === 'ArrowLeft') navigateCarousel(-1); if (e.key === 'Escape') closeLightbox();
            });
        }

        function handleSwipeGesture() {
            const threshold = 50;
            if (touchStartX - touchEndX > threshold) navigateCarousel(1); else if (touchEndX - touchStartX > threshold) navigateCarousel(-1);
        }

        function openUploadModal() {
            const modal = document.getElementById('upload-modal'); const box = document.getElementById('upload-box');
            modal.classList.ireplace('hidden', 'flex'); setTimeout(() => { box.classList.remove('opacity-0', 'scale-95'); }, 10);
        }

        function closeUploadModal() {
            const modal = document.getElementById('upload-modal'); const box = document.getElementById('upload-box');
            box.classList.add('opacity-0', 'scale-95');
            setTimeout(() => { modal.classList.ireplace('flex', 'hidden'); resetUploadState(); }, 300);
        }

        function handleFileQueueSelection(e) {
            const files = Array.from(e.target.files); if(files.length === 0) return;
            uploadFileQueue = files.map((file, index) => ({ id: index, file: file, status: 'pending' }));
            const queueContainer = document.getElementById('queue-container');
            const queueListHTML = document.getElementById('upload-queue-list');
            
            queueListHTML.innerHTML = uploadFileQueue.map(item => `
                <div id="queue-row-${item.id}" class="flex justify-between items-center bg-zinc-900/60 border border-zinc-800 rounded-lg px-3 py-2 text-xs">
                    <span class="truncate max-w-[70%] font-medium text-zinc-300">${item.file.name}</span>
                    <span id="queue-status-${item.id}" class="text-zinc-500 font-medium flex items-center gap-1"><i data-lucide="clock" class="w-3.5 h-3.5"></i> Pending</span>
                </div>`).join('');

            queueContainer.classList.remove('hidden');
            document.getElementById('upload-btn').removeAttribute('disabled');
            document.getElementById('upload-btn').innerText = `Upload ${uploadFileQueue.length} Items`;
            lucide.createIcons();
        }

        async function processUploadQueue() {
            const mainBtn = document.getElementById('upload-btn');
            mainBtn.setAttribute('disabled', 'true'); mainBtn.innerText = "Processing Queue...";

            for (let i = 0; i < uploadFileQueue.length; i++) {
                const item = uploadFileQueue[i];
                const statusLabel = document.getElementById(`queue-status-${item.id}`);
                statusLabel.className = "text-blue-400 font-medium flex items-center gap-1";
                statusLabel.innerHTML = `<div class="animate-spin rounded-full h-3 w-3 border-t border-blue-400"></div> Pushing...`;

                try {
                    await uploadSingleFilePromise(item.file);
                    statusLabel.className = "text-green-400 font-semibold flex items-center gap-1";
                    statusLabel.innerHTML = `<i data-lucide="check-circle" class="w-3.5 h-3.5"></i> Sent`;
                    lucide.createIcons();
                } catch (err) {
                    statusLabel.className = "text-red-400 font-semibold flex items-center gap-1";
                    statusLabel.innerHTML = `<i data-lucide="alert-triangle" class="w-3.5 h-3.5"></i> Failed`;
                    lucide.createIcons();
                }
            }
            mainBtn.innerText = "Queue Complete! Reloading...";
            setTimeout(() => { location.reload(); }, 1200);
        }

        function uploadSingleFilePromise(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = async () => {
                    const base64Content = reader.result.split(',')[1];
                    const safeName = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '_')}`;
                    const uploadUrl = `https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${CONFIG.folder}/${safeName}`;
                    try {
                        const res = await fetch(uploadUrl, {
                            method: 'PUT',
                            headers: { 'Authorization': `token ${CONFIG.token}`, 'Content-Type': 'application/json' },
                            body: JSON.stringify({ message: `Batch Upload: ${safeName}`, content: base64Content })
                        });
                        if (res.ok) resolve(); else reject();
                    } catch (e) { reject(e); }
                };
                reader.onerror = (err) => reject(err);
            });
        }

        function resetUploadState() {
            uploadFileQueue = [];
            document.getElementById('queue-container').classList.add('hidden');
            document.getElementById('upload-queue-list').innerHTML = '';
            document.getElementById('upload-btn').setAttribute('disabled', 'true');
        }

        async function deleteSelectedMedia() {
            if (!CONFIG.token) return alert("Auth token required.");
            if (!confirm(`Permanently remove ${selectedItems.length} items?`)) return;
            try {
                for (const item of selectedItems) {
                    await fetch(`https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${CONFIG.folder}/${item.name}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `token ${CONFIG.token}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: `Delete: ${item.name}`, sha: item.sha })
                    });
                }
                location.reload();
            } catch (e) { alert("Error deleting items."); }
        }

        DOMTokenList.prototype.ireplace = function(a, b) { this.add(b); this.remove(a); };
    </script>
</body>
</html>
